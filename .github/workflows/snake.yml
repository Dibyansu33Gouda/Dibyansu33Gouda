name: Generate contribution snake

on:
  # Keep the animation fresh once per day.
  schedule:
    - cron: "17 0 * * *"

  # Lets you generate it immediately from the Actions tab.
  workflow_dispatch:

  # Regenerate when the profile README or workflow changes.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23d4ff4f&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23d4ff4f&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Publish animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore: update contribution snake"
